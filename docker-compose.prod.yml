# Jarvis — Production Compose Stack (3-Microservice Tier).
#
# Flexible stack supporting both CDN-backed public deployments and
# 100% offline self-hosted 3-container setups.
#
# Usage:
#   1. Copy template:  cp .env.prod.example .env.prod
#   2. Edit variables: nano .env.prod
#   3. Run container:  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#

services:
  # --- 1. LLM: Dedicated Pre-Baked Inference Engine Container ---
  llama:
    # Blocks privilege escalation outright: a setuid binary inside the image cannot gain
    # anything, and the container starts with no capabilities at all. Neither the
    # orchestrator, llama-server nor unprivileged nginx needs any.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: ${LLAMA_IMAGE:-ghcr.io/ravijangid820/jarvis-llama:latest}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # --- 2. Orchestrator: Pure Python API + RAG + Auth + TTS ---
  orchestrator:
    # Blocks privilege escalation outright: a setuid binary inside the image cannot gain
    # anything, and the container starts with no capabilities at all. Neither the
    # orchestrator, llama-server nor unprivileged nginx needs any.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: ${ORCH_IMAGE:-ghcr.io/ravijangid820/jarvis-orchestrator:latest}
    depends_on:
      llama:
        condition: service_healthy
    environment:
      - JARVIS_FAST_BRAIN_URL=${JARVIS_FAST_BRAIN_URL:-http://llama:8081/v1/chat/completions}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5000}
      - EMBED_MODEL=${EMBED_MODEL:-google/embeddinggemma-300m}
      - HA_URL=${HA_URL:-}
      - HA_TOKEN=${HA_TOKEN:-}
      - HA_ALLOWED_ENTITIES=${HA_ALLOWED_ENTITIES:-}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
      - HOST_PORT=${HOST_PORT:-5000}
    ports:
      - "${HOST_PORT:-5000}:5000"
    # Declared here as well as in the image so the frontend's service_healthy gate works even
    # against an older published orchestrator that predates the image-level HEALTHCHECK.
    # -k, and the https retry: the entrypoint serves HTTPS when tls/ holds a cert.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || curl -fsSk https://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # NOTE: this mount REPLACES /app/config, hiding the schema.sql and templates the image
      # ships there. The entrypoint restores them from /opt/jarvis/config-template on start, so an
      # empty host directory is fine — but don't be surprised to see those files appear in it.
      - ${CONFIG_DIR:-./config}:/app/config
      - ${TLS_DIR:-./tls}:/app/tls:ro
      - jarvis-prod-data:/app/memory
    restart: unless-stopped

  # --- 3. Frontend: Optional Nginx Web Server (For 100% offline self-hosting) ---
  # The orchestrator already serves the SPA on ${HOST_PORT}, so this service is only worth running
  # when you want the web tier separate — a different port/host, its own TLS termination, or a
  # cache in front. It proxies /api/ back to the orchestrator (JARVIS_API_UPSTREAM) and carries its
  # own copy of the browser-side model bundles, so it is self-sufficient.
  #
  # Enable with:  docker compose --env-file .env.prod -f docker-compose.prod.yml --profile web up -d
  frontend:
    # Blocks privilege escalation outright: a setuid binary inside the image cannot gain
    # anything, and the container starts with no capabilities at all. Neither the
    # orchestrator, llama-server nor unprivileged nginx needs any.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles: ["web"]
    image: ${FRONTEND_IMAGE:-ghcr.io/ravijangid820/jarvis-frontend:latest}
    environment:
      # The SPA is built with VITE_API_URL=/api; nginx forwards that prefix here. If the
      # orchestrator serves HTTPS (tls/ mounted), point this at https://orchestrator:5000.
      - JARVIS_API_UPSTREAM=${JARVIS_API_UPSTREAM:-http://orchestrator:5000}
    ports:
      # Container-side 8080 because the image runs unprivileged and cannot bind a port below
      # 1024. The PUBLISHED port is unchanged, so the URL you use does not move.
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      # nginx resolves the proxy_pass host at startup, so it must not race the orchestrator.
      orchestrator:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jarvis-prod-data:
