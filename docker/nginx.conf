server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cross-origin isolation: without these two the browser withholds SharedArrayBuffer and the
    # in-browser Whisper runtime drops to a single thread. Kept in step with the orchestrator's
    # _apply_security_headers — if one side changes, change both.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Failsafe STT model bundle (mounted from the orchestrator's models/stt). Public, pinned
    # upstream weights — no secret — and immutable until a version bump.
    location /stt-models/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Optional internal reverse proxy to backend orchestrator API
    location /api/ {
        proxy_pass http://orchestrator:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
