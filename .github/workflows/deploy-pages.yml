# Deploy the React frontend to GitHub Pages.
#
# The static SPA is built with Vite and deployed to:
#   https://ravi-mk42.me/jarvis/   (custom domain via Ravijangid820.github.io CNAME)
#
# The backend (orchestrator + LLM) runs separately on Proxmox. Set VITE_API_URL
# at build time to point the frontend at the backend's public URL (once exposed).
# Without it, the UI loads but shows "backend offline" — fine for showcasing the UI.

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main, production-setup, github-pages-deploy]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:      # manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: frontend
        env:
          VITE_BASE_PATH: /jarvis/
          # The public API origin. It must appear in the demo container's ALLOWED_ORIGINS as
          # https://ravi-mk42.me (the origin this page is served from), or every call is blocked
          # by CORS. Unlike the container images, this build is cross-origin to its backend.
          VITE_API_URL: https://api.ravi-mk42.me
        run: npm run build

      # The face and wake-word workers fetch their models from BASE_URL — i.e. from Pages, not
      # from the API host — and neither upstream can be fetched cross-origin by a browser (the
      # OpenCV Zoo serves over git-LFS without permissive CORS). If they are not in dist/, face
      # enrolment and the wake word are dead on the public site with nothing in the API logs to
      # say so. Same SHA-256-pinned script the container images use.
      #
      # The STT failsafe is deliberately skipped: on Pages the worker uses huggingface.co, which
      # is the official first-party source and does send CORS headers.
      - name: Add browser-side model bundles (face + wake word)
        env:
          SKIP_STT_MODEL: "1"
        run: |
          bash src/scripts/fetch_browser_models.sh "$RUNNER_TEMP/browser-models"
          mv "$RUNNER_TEMP/browser-models/face" frontend/dist/face-models
          mv "$RUNNER_TEMP/browser-models/wake" frontend/dist/wake-models
          ls -la frontend/dist/face-models frontend/dist/wake-models

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
