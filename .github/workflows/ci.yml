name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dev dependencies
        # Only the dev group is needed for lint + the pure unit tests (no model download).
        run: uv sync --only-group dev

      - name: Ruff
        run: uv run ruff check src/orchestrator src/scripts tests

      - name: Pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The 86 node --test suites used to run ONLY on the author's machine: this job went
      # straight from lint to build, so anything they would have caught reached main unopposed.
      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
